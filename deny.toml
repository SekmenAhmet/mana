# cargo-deny configuration — the dependency gate.
# Renovate-style updaters propose newer versions; this file is the other half:
# it blocks what should never ship, whatever the version.

[advisories]
# RustSec advisories: any known vulnerability in the tree fails the check.
# Unmaintained crates warn rather than fail; the ones we knowingly carry are
# listed below with the reason they are still here.
version = 2
yanked = "deny"
# Every entry here is a known, accepted debt with an exit path — not noise to
# silence. Remove the entry when the exit lands: an ignore whose carrier has
# left the tree is reported by `cargo deny check advisories --show-stats` as
# `advisory-not-detected` (a warning, not an error — hence the flag, without
# which a stale entry sits here unnoticed).
ignore = [
    # paste (unmaintained) comes via ratatui 0.29; revisit at the TUI v2
    # rework (task 2.4), which bumps ratatui anyway.
    "RUSTSEC-2024-0436",
    # number_prefix (unmaintained) via self_update -> indicatif; cosmetic
    # progress-bar formatting, no untrusted input reaches it.
    "RUSTSEC-2025-0119",
    # Quadratic-time HTML attribute parsing via self_update's release-notes
    # rendering. cargo update cannot reach a fixed version while self_update
    # 0.41 pins it; inputs are GitHub release notes for our own repo, not
    # arbitrary attacker HTML. Revisit on the next self_update release.
    "RUSTSEC-2026-0194",
    # Same tree and same reasoning: unbounded namespace allocation in the XML
    # reader under self_update; our only input is our own GitHub release
    # metadata. Revisit together with the entry above.
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# mana itself is publish = false and its license is deliberately undecided for
# now (Ahmet, 2026-08-15) — skip the check for unpublished crates so the gate
# stays meaningful for dependencies without forcing that decision early.
private = { ignore = true }
# Allowlist, not denylist: an unexpected license should be a conscious
# decision, not something that slips in with a transitive dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]

[bans]
# Duplicate major versions bloat the binary and usually signal a dependency
# that should be aligned; warn (not deny) because transitive dupes are often
# outside our control.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything comes from crates.io — a git or path dependency appearing here
# should be a deliberate, reviewed choice.
unknown-registry = "deny"
unknown-git = "deny"
