# cargo-deny configuration — the dependency gate.
# Renovate-style updaters propose newer versions; this file is the other half:
# it blocks what should never ship, whatever the version.

[advisories]
# RustSec advisories. `version = 2` dropped the per-kind severity knobs: every
# advisory in the tree fails the check, unmaintained and unsound exactly like a
# vulnerability. `ignore` below is the only way past one -- which is why an
# unmaintained crate we knowingly carry has to be listed there, with the reason
# it is still here, rather than left to warn.
version = 2
yanked = "deny"
# Every entry here is a known, accepted debt with an exit path — not noise to
# silence. Remove the entry when the exit lands: an ignore whose carrier has
# left the tree is reported by `cargo deny check advisories --show-stats` as
# `advisory-not-detected` (a warning, not an error — hence the flag, without
# which a stale entry sits here unnoticed).
ignore = [
    # paste (unmaintained) comes via ratatui 0.29; revisit at the TUI v2
    # rework (task 2.4), which bumps ratatui anyway.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2025-0119 (number_prefix, unmaintained) used to be listed here.
    # self_update 0.44 moved to indicatif 0.18, which replaced number_prefix
    # with unit-prefix, and the crate left the tree:
    # `cargo deny check advisories --show-stats` reported the entry as
    # `advisory-not-detected`, so it was removed (2026-08-15).
    #
    # Both entries below are quick-xml 0.38.4, reached only through
    # self_update -> its S3 backend's bucket-listing parser. mana uses the
    # GitHub backend, so that code never runs in this binary; the advisories
    # fire because quick-xml is a hard dependency of self_update at 0.44,
    # not because the parser is reachable.
    #
    # Exit path: quick-xml fixes both in 0.41.0, and self_update reaches it in
    # 1.0.0 -- which also puts quick-xml behind a non-default `s3` feature, so
    # the entries would disappear twice over. 1.0.0 is still a release
    # candidate (1.0.0-rc.6 as of 2026-08-15) and renames a third of the API
    # (`Status` -> `VersionStatus`, `compression-flate2` ->
    # `compression-tar-gz`, per-backend features), so mana waits for it to be
    # stable. Attempted and rejected at task 4.1.
    #
    # Quadratic-time duplicate-attribute checking in the XML reader.
    "RUSTSEC-2026-0194",
    # Unbounded namespace-declaration allocation in the same reader.
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# mana is MIT OR Apache-2.0 (chosen 2026-08-16) and still publish = false —
# crates.io is a separate decision. The gate now checks mana's own license
# like any other crate's; both halves of the pair are in the allowlist below.
# Allowlist, not denylist: an unexpected license should be a conscious
# decision, not something that slips in with a transitive dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]

[bans]
# Duplicate major versions bloat the binary and usually signal a dependency
# that should be aligned; warn (not deny) because transitive dupes are often
# outside our control.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything comes from crates.io — a git or path dependency appearing here
# should be a deliberate, reviewed choice.
unknown-registry = "deny"
unknown-git = "deny"
