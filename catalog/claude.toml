# Claude Code -- the reference entry. Every flag here was measured against a
# real install on 2026-08-15; nothing is inferred from documentation.
schema = 1

# `notes` is a top-level key, so it has to sit before the first [table] header:
# in TOML every key written after a header belongs to that table, and the same
# line placed at the bottom of the file would silently become `install.notes`.
notes = '''
Never pass `--tools ""` to this CLI: it inflates the context to ~167k tokens
and zeroes cache reads, which turned a $0.11-0.53 PM turn into $1.57 on
2026-08-15. Leave the default tool set alone.

The `stream` driver was verified multi-turn on 2026-08-15: one process, session
continuity held across turns, clean exit.

The static models are the CLI's own aliases (--model "Provide an alias for the
latest model"), so they track vendor releases without catalogue edits.

Verified live (2026-08-15, headless probe with this exact argv): the mana MCP
server connects and its four tools are callable under the mcp__mana__ prefix
without a permission prompt, while a Write attempt is refused with "requested
permissions ... but you haven't granted it" and no file appears. The PM is
mechanically read-only, as [pm].permission_args intends.

`--continue` was measured on this machine on 2026-08-15, twice, because
[pm].resume_args rests on it:

  1. Semantics, plain print mode: `claude -p --model haiku` was asked to
     remember PLATYPUS-7734 in a scratch directory; a second process,
     `claude -p --continue --model haiku`, answered "PLATYPUS-7734". Context
     survives across processes, and (like every other CLI measured here) the
     conversation is keyed by the working directory.
  2. The flag combination mana actually launches with:
     `-p --input-format stream-json --output-format stream-json --verbose
     --continue --allowedTools ...`, one user frame on stdin. Accepted, exit 0,
     the answer was again PLATYPUS-7734, and the stream opened with
     `{"type":"system","subtype":"hook_started","hook_name":"SessionStart:resume"}`
     -- the CLI's own word for what it did. $0.049 for that turn.

So `--continue` composes with stream-json rather than replacing it, which is
why resume is one appended flag and not a second driver.
'''

[cli]
id           = "claude"
name         = "Claude Code"
bin          = "claude"            # optional [cli.bin_overrides] per OS
version_args = ["--version"]

[pm]
driver = "stream"                  # acp | stream | oneshot-continue
args   = ["-p", "--input-format", "stream-json",
          "--output-format", "stream-json", "--verbose"]
prompt = "stdin-jsonl"             # argv | stdin | stdin-jsonl
# `mana launch claude --continue` -- appended after args, measured above.
resume_args = ["--continue"]

# The PM must be mechanically unable to write code (design §6). An allowlist is
# the only enforcement this CLI offers, so it gets one: mana's four
# orchestration tools (`mcp__mana__*`, the MCP server registers under the name
# `mana`), plus the three read-only tools a planner needs to look at the project
# before writing a brief. Edit, Write, Bash and Task are absent, so an attempt
# to implement the work itself fails at the tool layer instead of quietly
# burning the expensive quota this whole design exists to spend on judgment.
#
# Not `--tools`: see the note above about what that flag does to the context.
permission_args = ["--allowedTools", "mcp__mana__*,Read,Grep,Glob"]

[pm.events]                        # non-ACP drivers only; 3 fields MAX (design §4)
# `$.type=='assistant'` is not decoration: this CLI echoes a loaded skill back
# as a frame with *exactly* the shape of an assistant message --
# `{"type":"user","isSynthetic":true,"message":{"role":"user","content":
# [{"type":"text","text":"Base directory for this skill: ...\n\n# mana PM\n..."}]}}`
# -- and the unscoped filter matched it, so the chat pane opened on the whole of
# SKILL.md rendered as the PM's own words (reported by the user, reproduced with
# this argv on 2026-08-16 and recorded in goldens/claude/skill-echo.jsonl).
# An absolute ($-rooted) query inside a filter is RFC 9535 and serde_json_path
# implements it, so the frame scope is data here rather than an `if` in Rust.
text  = "$.message.content[?@.type=='text' && $.type=='assistant'].text"
usage = "$.usage"
# The end of a turn, which is what lets mana hold a typed line back instead of
# dropping it into the middle of an answer. This CLI closes every turn with one
# `result` frame -- present in both goldens, and emitted for a failed turn too
# (`subtype: error_during_execution`), which is what stops a queue wedging on a
# turn that went wrong.
turn_end = { path = "$.type", equals = "result" }

[tools]
channel  = "mcp"                   # mcp | sentinel
mcp_args = ["--mcp-config", "{config_path}"]

[subagent]
args                  = ["-p", "--verbose", "--output-format", "stream-json"]
# --verbose is mandatory with -p + stream-json (the CLI refuses otherwise;
# caught by the first real M1 dispatch on 2026-08-15).
auto_approve_args     = ["--dangerously-skip-permissions"]
model_args            = ["--model", "{model}"]
prompt                = "argv"
max_concurrent        = 0          # 0 = unlimited
cwd_required_in_brief = false

[models]
discovery_args = []                # empty = static list only
# line_regex   = '^(\S+)\t'        # capture group = model id

[[models.static]]
id         = "haiku"
cost_class = "cheap"               # cheap | mid | expensive -- ordinal ONLY
pool       = "plan"

[[models.static]]
id         = "sonnet"
cost_class = "mid"
pool       = "plan"

[[models.static]]
id         = "opus"
cost_class = "expensive"
pool       = "plan"

[[quota.pools]]
id         = "plan"
kind       = "tokens"              # requests | tokens | credits | unknown
period     = "5h-window"
pool_scope = "global"              # global | per-model

[[failure]]                        # ordered; first match wins
means            = "rate_limited"  # quota_exhausted | rate_limited | auth_expired
stdout_regex     = "rate.?limit"
cooldown_minutes = 60

[skills]
# Project-local first, and that ordering is the whole point: `~/.claude/skills`
# is a global list (140 skills on this machine), and every earlier mana launch
# added `mana-pm` to it for every project the user ever opens. A relative entry
# resolves against the project root mana was launched in, so the PM role is
# installed where it is used and nowhere else. mana deletes any `mana-pm/` it
# finds in the other directories of this list on every launch, which is what
# clears the global copy earlier versions left behind -- and it matters beyond
# tidiness: with the same skill name in both places, the docs say the personal
# one wins, so a stale global copy would shadow the fresh project one.
#
# Verified against the CLI's own documentation (code.claude.com/docs/en/skills,
# read 2026-08-15): "Project | .claude/skills/<skill-name>/SKILL.md | This
# project only", loaded from the directory Claude Code starts in and every
# parent up to the repository root. mana starts it in the project root and
# writes the file before spawning, which is also what the docs require ("If you
# create a top-level skills directory that didn't exist when the session
# started, restart Claude Code").
#
# And verified live the same day, because a directory the CLI ignores would
# leave the PM with no role at all: a scratch project got
# `.claude/skills/mana-probe-zx9/SKILL.md` and nothing else, and
# `claude -p --model haiku --disallowedTools "Read,Glob,Grep,Bash,..."` --
# every file tool denied, so it could not have gone looking -- answered
# "mana-pm, mana-probe-zx9". The project skill was in its context, and the
# second name is the stale global copy this cleanup exists to remove.
dirs = [".claude/skills", "~/.claude/skills", "~/.agents/skills"]

[install]
url = "https://claude.com/claude-code"
