# Antigravity -- Google's successor to the retired Gemini CLI (which stopped
# serving Pro/Ultra and free accounts on 2026-06-18). The binary is `agy`;
# "Antigravity" is only the product name.
schema = 1

# Top-level key, so it has to precede the first [table] header -- see the same
# note in claude.toml for why the bottom of the file would not work.
notes = '''
Measured on 2026-08-15 (this machine, agy 1.1.13): headless `-p`/`--print`;
output formats text/json/stream-json; auto-approve
`--dangerously-skip-permissions` and `--sandbox`; `agy models` returns 14 models
across three vendors as TSV; quota is per-model. No ACP surface and no MCP
surface at all -- hence the oneshot-continue driver and the sentinel tool
channel.

`--print` takes the prompt as its *value*, not as a positional argument (the
`--prompt` alias in `--help` is the giveaway; it is a Go `flag` string). An
earlier draft of this entry wrote `["--print", "--output-format", "stream-json",
"{prompt}"]` and agy dutifully answered a question about the string
"--output-format", in plain text, on the default model -- one wasted request
that looked like a working call. So `{prompt}` sits directly after `--print`,
and everything else comes first. Trailing flags after the value still parse,
which is what makes the driver's `extra_args` safe to append (nothing appends
any today: the sentinel channel needs no flags). The same correction applies to
[subagent].args, which had the same shape and would have sent every sub-agent
a brief the CLI never read.

[pm.events] paths are measured against a real `--output-format stream-json`
turn, not copied from another entry (they were, and matched nothing):

  {"event":"init","conversation_id":...,"init":{"model":...,"cwd":...,"tools":[...]}}
  {"event":"step_update","step_update":{"step_type":"agent_response",
     "state":"ACTIVE","text_delta":"noted."}}
  {"event":"result","result":{"status":"SUCCESS","response":"noted.\n",
     "usage":{"input_tokens":15008,...}}}

`text` reads `$.result.response` -- the whole answer, once, at the end of the
turn -- rather than `$.step_update.text_delta`. The deltas are real streaming
(one event per chunk, and the chunking varies: two events for a six-character
answer on one turn, one for the next), but each would become its own chat line,
and the sentinel channel needs whole fenced blocks rather than halves of one.
The cost is honest and worth writing down: nothing of a turn is rendered until
it ends. The `init` frame matches neither path and so shows as one ~1.3 kB raw
line per turn, which is the price of a process per turn.

`--continue` **preserves context across print calls** (the design's open item,
answered 2026-08-15): turn 1 was asked to remember PLATYPUS-7734, turn 2 -- a
separate process with `--continue` -- answered with the token, and both frames
carried the same conversation_id. It is scoped to the **working directory**:
the same `--continue` from another directory opened a fresh conversation that
knew nothing. So a mana session is pinned to a project by the directory it
launches the turn in, and two mana sessions in the *same* directory would fight
over one conversation.

Cost and timing of a PM turn (gemini-3.7-flash-low, trivial prompts): 5.5 s
wall for the first turn, 18.2 s for the second, of which ~3.5 s is process
startup before the model is reached -- a per-turn process is not free. Token
input is 15.0k on turn 1 and 30.3k on turn 2 for a two-word answer: agy sends a
large system prompt every turn and replays the conversation, and no cache read
was reported on either. A whole `mana launch agy` session -- activation,
list_agents, create_task, and the PM reading each result back -- was 4 turns and
34,765 tokens end to end, about 10 s a turn.

`$.result.usage` is **cumulative over the conversation**, not per turn: the four
result frames of that session reported 18,245 / 23,296 / 28,835 / 34,765. That
is the right number for a "session so far" readout and the wrong one to add up.

Print mode denies tool permission requests instead of prompting -- there is no
human to ask, so `run_command`, `grep_search` and `view_file` all came back
"User denied permission" (and a read under the CLI's own config directory was
refused by a hardcoded protection rule before the policy was even consulted).
That is what mechanically keeps this PM from writing code, and it is also why
the role text has to be inlined -- see [skills] below.

Degraded: the denial is not confined to writes. Reads, tree searches and shell
are refused the same way, which is everything a PM would use to check
repository state before writing a brief. Confirmed in black-box QA 2026-08-16,
where the agy PM said so itself -- "I can't read files from this CLI, so paste
or describe it and I'll write the brief". A PM on agy works from what the user
pastes into the chat and nothing else; briefs it writes about existing code are
only as accurate as that paste. No read-only-approve mode was found on this
CLI; the only permission flag it has is the all-or-nothing
`--dangerously-skip-permissions`, which a PM must never be given.

The sentinel channel cannot tell a block the PM meant from one it merely
quoted (probed 2026-08-16). mana executes every top-level ```mana fence in the
turn's text; a `mana` fence nested inside another fence is left as prose, but
text copied verbatim out of a file, an issue or a pasted log carries no such
wrapper. Asked to quote such a block "as documentation", this PM refused on its
own reasoning -- "a ```mana block in my output is a live tool call" -- so the
defence held, but it rests on the skill text, exactly like the no-code rule
above. The surface is small today: agy is the only sentinel CLI, and it cannot
read files, so the only text it can quote is what the user pasted in. If it
ever needs hardening: a per-turn nonce the PM must include, or honouring blocks
only in a turn that quoted no user-supplied text.

Two parallel dispatches died within 8 seconds, so max_concurrent is 1. The same
limit is a hazard the PM role cannot see: while agy is the PM, a turn of its own
and an agy sub-agent dispatch are two agy processes at once. Since #145 that is
one of the reasons [subagent].routing_weight below is the lowest of the four --
mana still routes here when the PM asks for it, and no longer picks it by
default. mana does not detect the PM-slot collision itself: it would have to
know which CLI is running as the PM at routing time, and weighting the entry
down covers the same case without threading that fact through the router.

A brief without an absolute cwd wasted 306k tokens because this CLI ignores its
working directory unless the brief spells it out, hence cwd_required_in_brief.
(The process does receive a cwd -- the init frame echoes it, and `--continue`
keys off it. It is the *model* that will not use it to resolve relative paths.)

`--version` prints more than one line here; callers must keep only the first.

The [[models.static]] seed below was added on 2026-08-16 for #31, where a PM
told to dispatch onto agy invented `gemini-2.5-flash` and then
`gemini-2.5-pro`, and both died in 3.5 s. Discovery gives ids and never a cost
class, so an entry with no statics is unreachable by every cost_class route and
invisible in `list_agents` -- the PM had nothing to name but a guess. The seed
is measured (`agy models`, this machine, that day) and deliberately partial;
the cost classes in it are ordinal judgements, not prices agy publishes.

Still unverified:
- Whether every one of agy's ~30 tools is denied the same way, or only the ones
  observed (`grep_search`, `run_command`, `view_file`). The PM's no-code rule
  therefore still rests on the skill text as well, which design §6 accepts.
- The quota pool has no observed period, so it is recorded as "unknown"
  alongside kind = "unknown".
- No failure signature is declared at all: nothing quota-shaped has ever been
  observed from agy (the daily-note matrix records its quota signal as
  literally "nothing"). An earlier draft carried over a signature measured on
  copilot (exit 1 + empty stderr + "402"), which would have produced false
  cooldowns here -- removed 2026-08-15. Until a real agy quota failure is
  captured, exhaustion surfaces as a generic failure the PM escalates.
- No agy-specific skills directory was found, so only the vendor-neutral
  ~/.agents/skills is listed. No project-local equivalent is known either, and
  finding one would change nothing here: this CLI never reads the file at all
  (inline_in_activation below), so where mana writes it is academic. The one
  concrete effect of the global directory is that `mana-pm` shows up in every
  other tool that reads ~/.agents/skills, which is why claude's entry now
  installs into the project and mana deletes the stale global copy it finds.

`mana launch agy --continue` needs no [pm].resume_args and has none: this
driver resumes by making the *first* turn of the session use continue_args
instead of first_args, which is the `--continue` already written below. Its
cwd scoping (measured above) is what makes that the right session to resume.
'''

[cli]
id           = "agy"
name         = "Antigravity"
bin          = "agy"
version_args = ["--version"]

[pm]
driver        = "oneshot-continue" # acp | stream | oneshot-continue
# `--print` takes the prompt as its value, so `{prompt}` follows it directly and
# every other flag comes before it -- see notes for the request this cost.
first_args    = ["--output-format", "stream-json", "--print", "{prompt}"]
continue_args = ["--output-format", "stream-json", "--continue", "--print", "{prompt}"]
prompt        = "argv"             # argv | stdin | stdin-jsonl

# No permission_args on purpose: nothing equivalent to an allowlist was measured
# on this CLI (only the opposite -- `--dangerously-skip-permissions`, which
# sub-agents want and a PM must never have). So the PM's no-code rule is carried
# by the skill text alone here, which design §6 accepts as the fallback where a
# CLI offers no mechanism. Inventing a flag would be worse than having none: an
# unrecognised argument is how a launch fails at startup for no reason.

[pm.events]                        # non-ACP drivers only; 3 fields MAX (design §4)
text  = "$.result.response"        # the whole turn, once, when it ends
usage = "$.result.usage"
# No turn_end: this driver runs one process per turn, so the turn is over when
# the process is, and the transport says so without reading a frame. Both paths
# above are already scoped to the `result` event by their own prefix, so the
# skill-echo class of bug (see claude.toml) cannot reach them: agy's other
# frames are `init` and `step_update`, neither of which carries `$.result`, and
# this CLI never gets to load a skill file at all (inline_in_activation).

[tools]
channel = "sentinel"               # no MCP surface found

[subagent]
# `{prompt}` is placed rather than appended, for the same reason as [pm]: the
# brief is the value of `--print`, not a trailing positional. Verified that the
# auto-approve and model flags still parse *after* it (the init frame echoed
# back the model asked for), which is what makes this ordering safe with the
# flags mana appends.
args                  = ["--output-format", "stream-json", "--print", "{prompt}"]
auto_approve_args     = ["--dangerously-skip-permissions"]
model_args            = ["--model", "{model}"]
prompt                = "argv"
max_concurrent        = 1          # two parallel dispatches died in 8s
cwd_required_in_brief = true       # 306k tokens wasted without it
# Preference when mana routes for itself; higher wins, 50 is the default. The
# lowest of the four, and the reason the field exists (#145): the one slot
# above is already held by this CLI's own PM turn whenever agy is the PM (#109),
# print mode denies *reads* as well as writes so a sub-agent here cannot look at
# the repository it was sent to (#41), and a brief that does not spell out
# absolute paths is thrown away. Every one of those is acceptable when the PM
# names agy on purpose -- which still works, cost class and all -- and none of
# them is acceptable as the choice mana makes when the PM expressed no
# preference. Not 0: the seed below exists so this quota gets spent (#31), and a
# floor value would make the entry unreachable again the moment mana routes.
routing_weight        = 10

[models]
# Discovery stays authoritative -- `agy models` returns 14 ids across three
# vendors and no curated list will keep up with that. The static entries below
# are not that list: they are the *routing seed*, the subset mana is allowed to
# choose on its own. It needs one because discovery reports ids and nothing
# reports a cost class, so with no statics at all every cost_class route
# silently resolved to claude and this CLI's quota was never spent (#31). An id
# outside the seed is still dispatchable when the PM names it together with
# "cli" -- see `routing::validate_model`.
discovery_args = ["models"]        # refresh the seed from its output
line_regex     = '^(\S+)\t'        # capture group = model id (output is TSV)

# Seeded from `agy models` on 2026-08-16. One generation only, on purpose: the
# router breaks a cost-class tie alphabetically, so listing gemini-3.5 and
# gemini-3.6 beside gemini-3.7 would send every cheap dispatch to the oldest
# flash on the list. Same reason the three reasoning efforts are not all here.
[[models.static]]
id         = "gemini-3.7-flash-low"
cost_class = "cheap"               # cheap | mid | expensive -- ordinal ONLY
pool       = "default"

[[models.static]]
id         = "gemini-3.7-flash-high"
cost_class = "mid"                 # same model, more reasoning spent per turn
pool       = "default"

[[models.static]]
id         = "claude-sonnet-4-6"
cost_class = "mid"
pool       = "default"

[[models.static]]
id         = "gemini-3.1-pro-high"
cost_class = "expensive"
pool       = "default"

[[models.static]]
id         = "claude-opus-4-6-thinking"
cost_class = "expensive"
pool       = "default"

[[quota.pools]]
id         = "default"
kind       = "unknown"             # requests | tokens | credits | unknown
period     = "unknown"
pool_scope = "per-model"           # global | per-model

# No [[failure]] entries on purpose: no quota failure has ever been observed
# from this CLI, and a signature borrowed from another one would trigger false
# cooldowns -- see notes.

[skills]
dirs = ["~/.agents/skills"]
# Measured 2026-08-15, twice: the PM never gets to read this file. Told only to
# "load the mana-pm skill" it went hunting (grep_search under the CLI's own
# config dir -- refused by that CLI's protection rules; `find ~` -- refused by
# its permission policy) and answered nothing. Told the absolute path, it called
# view_file on exactly that path and got "User denied permission for
# read_file(...)": print mode auto-denies every tool permission request, reads
# included, and there is no human to ask. So on this CLI the role text has to
# arrive in the activation turn or it does not arrive at all.
inline_in_activation = true

[install]
url = "https://antigravity.google"
