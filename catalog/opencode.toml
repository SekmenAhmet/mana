# opencode -- the reference `acp` entry. Every flag here was measured against a
# real install (1.14.30) on 2026-08-15; nothing is inferred from documentation.
schema = 1

# Top-level key, so it has to precede the first [table] header -- see the same
# note in claude.toml for why the bottom of the file would not work.
notes = '''
ACP conformance, measured 2026-08-15 with a full client loop (`opencode acp`):
initialize answers protocolVersion 1; session/new returns a sessionId; and
**mcpServers is honoured** -- opencode spawned mana's MCP server from the
session/new payload and the agent really called `mana_list_agents`, answering
with the number of CLIs the tool returned. That is why [tools].mcp_args is
empty: the ACP handshake attaches mana, so no config file and no flag are
needed. This is the uneven area design §4 warns about, and opencode is the
side that works (copilot is the side that does not -- see its entry).

The turn shape, same probe: 39 agent_thought_chunk, 1 tool_call + 2
tool_call_update, 9 agent_message_chunk, 1 usage_update, then stopReason
"end_turn" carrying a usage object (totalTokens / inputTokens / outputTokens /
cachedReadTokens). Prose arrives token by token -- the nine chunks were "MAN",
"A", "-", "TO", "OLS", "-", "OK", " ", "2" -- which is why the driver coalesces
chunks into whole lines. Closing stdin exits cleanly (code 0).

Two session/prompt requests sent 0.3 s apart on one session were both answered
end_turn rather than refused, so mana's fire-and-forget turns (a user typing
while a dispatch notification is injected) do not need queueing here.

Sub-agent flags: `opencode run --format json` emits JSONL (`{"type":"text",
"part":{"text":...}}`, then a step_finish carrying tokens and cost) and takes
the prompt as a trailing positional. Two parallel `opencode run` dispatches
both completed with exit 0, so max_concurrent stays 0.

Quota: none of it is queryable. `opencode stats` is historical only (44
sessions, total cost $0.00 on this machine) and the models available here are
the free OpenCode Zen tier, so kind/period are recorded as unknown rather than
guessed. No [[failure]] entry: no quota-shaped failure has ever been observed
from this CLI, and a signature borrowed from another one would trigger false
cooldowns (the mistake caught on agy's entry on 2026-08-15).

The [[models.static]] seed was added on 2026-08-16 for #31: with no statics,
routing built its candidate list from an empty set and every cost_class
dispatch went to claude while these free models sat idle -- the opposite of
what the multi-quota design is for. Discovery gives ids and never a cost class,
so the class had to be written down by a human; the ids are measured
(`opencode models`, this machine, that day).

DEGRADATION -- the PM is not mechanically read-only here. During a real
`mana launch opencode` on 2026-08-15 the PM ran opencode's own `bash` and
`read` tools and **no session/request_permission was ever sent**, even though
mana advertises no filesystem and no terminal capability in `initialize`.
Those client capabilities only govern what the agent may ask *mana* to do;
they say nothing about the tools the agent already has. So on this CLI the
PM's no-code rule rests on the skill text alone, which design §6 accepts as
the fallback where a CLI offers no mechanism -- the same position agy is in,
for a different reason. If opencode grows a read-only agent or mode, it
belongs in [pm].args and this note goes away.

Session resume, measured 2026-08-15 with the same client loop: `initialize`
answers agentCapabilities.loadSession = true (and sessionCapabilities
{fork, list, resume}), and `session/load` really works -- one process created a
session and asked the agent to remember OCTOPUS-42, a *second* process
initialized, called session/load with that sessionId, and the agent answered
OCTOPUS-42. The reply carries {sessionId, models}. That capability flag is what
`mana launch opencode --continue` checks before it resumes; a CLI that does not
advertise it is refused rather than quietly started fresh. mana stores the
sessionId per project in ~/.mana/projects/<project>/state.toml.

Project-local skills exist here and [skills].dirs deliberately does not use
them yet. opencode's own docs (opencode.ai/docs/skills, read 2026-08-15) list
six directories: .opencode/skills, .claude/skills and .agents/skills inside the
project (walking up to the git worktree root), then ~/.config/opencode/skills,
~/.claude/skills and ~/.agents/skills. So the pollution fix claude's entry got
-- installing the PM role into the project instead of the user's global skill
list -- is available here as `.opencode/skills`. It is left unchanged because
it is unmeasured on this CLI: nothing has yet confirmed opencode reads a
project-local SKILL.md that appeared before the process started, and the note
is worth more than an untested reordering.

Unverified, and each is a candidate for a check before it is relied on:
- cwd_required_in_brief is set from the absence of evidence, not from a
  measurement: `opencode run` was only ever driven with mana's own cwd.
- The permission flow was therefore never exercised against this CLI at all:
  what it would ask for, and with which options, is still unmeasured.
'''

[cli]
id           = "opencode"
name         = "opencode"
bin          = "opencode"
version_args = ["--version"]        # prints a bare "1.14.30"

[pm]
driver = "acp"                      # acp | stream | oneshot-continue
args   = ["acp"]                    # `opencode acp` -- an ACP server on stdio

# No permission_args, and none is missing: ACP has no allowlist flag at all,
# and no read-only flag was found on this CLI either. Measured consequence (see
# notes): this PM can run bash without asking, so the no-code rule is carried by
# the skill text alone. Inventing a flag would be worse than having none -- an
# unrecognised argument is how a launch fails at startup for no reason.

# No [pm.events] and no [pm].prompt: both are non-ACP fields (design §4), and
# the catalogue rejects them for this driver. ACP carries typed notifications
# and typed content blocks instead.

[tools]
channel  = "mcp"                    # mcp | sentinel
mcp_args = []                       # attached through session/new's mcpServers

[subagent]
args                  = ["run", "--format", "json"]
auto_approve_args     = ["--dangerously-skip-permissions"]
model_args            = ["--model", "{model}"]   # ids are "provider/model"
prompt                = "argv"      # `opencode run [message..]`
max_concurrent        = 0           # 0 = unlimited; two in parallel measured OK
cwd_required_in_brief = false
# Preference when mana routes for itself; higher wins, 50 is the default. Above
# it because the quota this entry burns is free (the OpenCode Zen tier, $0.00
# over 44 sessions) and two parallel `opencode run` dispatches were measured
# completing -- spending free quota before paid is what #31 was about. Below
# claude because almost nothing else about an unattended run here is measured:
# cwd_required_in_brief above is set from the absence of evidence rather than
# from a test, and the permission flow has never been exercised at all.
routing_weight        = 60

[models]
# Discovery stays authoritative. The static entries below are not a second copy
# of it: they are the *routing seed*, the subset mana may choose on its own.
# It needs one because discovery reports ids and nothing reports a cost class,
# so with no statics at all every cost_class route silently resolved to claude
# and this free tier -- the whole point of routing here -- was never used (#31).
# An id outside the seed is *not* dispatchable, not even when the PM names it
# with "cli": `routing::validate_model` takes a non-static id only while the
# seed is empty, which #31 stopped being true here. To dispatch one more, seed
# it -- `mana doctor` prints seed and discovery side by side so the gap shows
# (#193).
discovery_args = ["models"]         # refresh the seed from its output
# No line_regex: the output is one bare "provider/model" id per line, unlike
# agy's TSV, so the whole line is the id.

# Seeded from `opencode models` on 2026-08-16 -- all seven, all cheap, because
# they are all the free OpenCode Zen tier and nothing here distinguishes them
# by cost. The router's alphabetical tiebreak therefore decides between them,
# which is the honest answer when the catalogue has no reason to prefer one.
[[models.static]]
id         = "opencode/big-pickle"
cost_class = "cheap"                # cheap | mid | expensive -- ordinal ONLY
pool       = "zen"

[[models.static]]
id         = "opencode/deepseek-v4-flash-free"
cost_class = "cheap"
pool       = "zen"

[[models.static]]
id         = "opencode/hy3-free"
cost_class = "cheap"
pool       = "zen"

[[models.static]]
id         = "opencode/laguna-s-2.1-free"
cost_class = "cheap"
pool       = "zen"

[[models.static]]
id         = "opencode/mimo-v2.5-free"
cost_class = "cheap"
pool       = "zen"

[[models.static]]
id         = "opencode/nemotron-3-ultra-free"
cost_class = "cheap"
pool       = "zen"

[[models.static]]
id         = "opencode/nemotron-3.5-lightning-free"
cost_class = "cheap"
pool       = "zen"

# This pool exists because a [[models.static]] has to name one, and it says
# "unknown" twice because that is still the truth: the tier in use is free,
# `opencode stats` reports history rather than a balance, and nothing on the
# CLI exposes a limit. It cools nothing today either -- cooldowns are driven by
# a matched [[failure]] signature and this entry declares none, for the reason
# in the notes. Give it a kind and a period only when one is measured.
[[quota.pools]]
id         = "zen"
kind       = "unknown"              # requests | tokens | credits | unknown
period     = "unknown"
pool_scope = "per-model"            # global | per-model

[skills]
dirs = ["~/.agents/skills"]         # verified: opencode reads SKILL.md from it

[install]
url = "https://opencode.ai"
