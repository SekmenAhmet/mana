[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The generated workflow otherwise also fires on every pull request to run
# `dist plan`. That check is worth having, but not as a second workflow named
# "Release" appearing on every PR to develop -- CI's `deps & coverage` job runs
# `dist generate --check` instead, which is the drift that actually bites
# (a config edited without regenerating the workflow). So: tags only.
pr-run-mode = "skip"
# Both archive formats are .tar.gz -- including on Windows, where dist would
# default to .zip -- because `mana upgrade` extracts them with `self_update`,
# whose feature set here is `archive-tar` + `compression-flate2` and nothing
# else. The alternative was adding the `archive-zip` feature (and the `zip`
# crate, and its audit surface) to ship a second format for one platform.
# Windows 10+ has bsdtar in the box, so a hand-download still unpacks.
windows-archive = ".tar.gz"
unix-archive = ".tar.gz"
