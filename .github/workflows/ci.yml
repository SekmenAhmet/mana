name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Same least-privilege shape as release-plz.yml: nothing at the top, each job
# asks for what it needs. Without this the token carries the repository-level
# default -- an out-of-repo setting no file here enforces, and one that comes
# back read/write on a fork or a re-created repo. CI runs third-party actions
# and a `curl | sh`; none of them needs to write anything.
permissions: {}

# Two pushes in quick succession: the older run is obsolete the moment the
# newer one starts — cancel it instead of burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # windows is in the matrix because v2 claims cross-platform support —
        # claimed-but-untested is how the v1 flow shipped broken.
        #
        # What that leg actually proves, measured at 0.1.0 (issue #105): 427 of
        # 548 in-module tests run there — 423 shared with unix plus 4 that only
        # exist here — and all 5 in tests/cli_smoke.rs. The 125 that do not are
        # `#[cfg(all(test, unix))]` because they exec `sh` fixtures: fake CLIs,
        # backgrounded grandchildren, `process_group(0)`. Porting each to a
        # batch file would be a second fixture suite to keep true, not a second
        # platform tested — those tests cover logic that already has a
        # platform-free test beside it (see `age_check_with`, `recycled_by_age`,
        # `render_table`: the pure half split out from the syscall on purpose).
        #
        # The gap that was worth closing is the other direction — Windows-only
        # code no leg could reach at all, where a typo in a shelled-out argument
        # list is invisible to the compiler. Now covered:
        # `spawn::windows_process_tests` (the `.cmd`-shim tree kill, hence
        # `taskkill /T /F`) and `status::windows_process_tests` (`tasklist`
        # parsing, the PowerShell creation-time read, and `guard`'s refusal).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Every third-party action is pinned to a full commit SHA, not a tag: a
      # tag is a mutable pointer the upstream owner can repoint at any commit,
      # and nothing in this repo would show a diff. The trailing comment is the
      # human-readable version; Renovate reads it and bumps the SHA with it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `@stable` is a branch, not a version -- pinned to the `master` commit
      # with the channel moved into `toolchain:`, which is what the branch did.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--locked` everywhere: without it cargo silently re-resolves against
      # Cargo.toml and throws the rewritten lock away with the runner, so a
      # green run proves *some* resolution builds, not the committed one --
      # while cargo-deny audits the lock as committed. The two would drift.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --all-targets --verbose

      - name: Test
        run: cargo test --locked --all-targets --verbose

      # Everything above runs the dev profile, which has overflow checks and
      # `debug_assert!`; `[profile.dist]` (release + thin LTO) has neither, and
      # a binary that fails to start at all -- bad linkage, missing runtime dep
      # -- was previously found by the first user to run `mana upgrade`.
      # `cargo run` builds *and* executes it, so one line covers both, on all
      # three OSes without hardcoding the target path.
      - name: Smoke-test the shipping profile
        run: cargo run --release --locked -- --version

  health:
    name: deps & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The dependency gate: RustSec advisories, license allowlist, duplicate
      # majors, source restrictions. Renovate proposes updates; this blocks
      # the bad ones. Config + accepted-debt list live in deny.toml.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # `.github/workflows/release.yml` is generated from dist-workspace.toml.
      # Editing one without regenerating the other is a release that builds the
      # wrong things, discovered at tag time; this catches it at PR time. The
      # version must match `cargo-dist-version` in dist-workspace.toml -- a
      # different dist generates a different workflow.
      #
      # release.yml now also carries one hand-added job (`guard`, issue #80),
      # which `--check` cannot know about, so dist-workspace.toml must set
      # `allow-dirty = ["ci"]` for this step to pass. See RELEASING.md.
      - name: Check the release workflow matches dist-workspace.toml
        # we specify bash to get pipefail; the default `bash -e` takes the exit
        # status of `sh`, so a 404 or a truncated body from the release URL
        # feeds `sh` garbage and still exits 0 -- surfacing one step later as
        # `dist: No such file or directory`.
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          "$HOME/.cargo/bin/dist" generate --check

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `@cargo-llvm-cov` is a rolling ref, not a version -- pinned to the
      # v2.86.1 commit with the tool name moved into `with:`, same behaviour.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-llvm-cov

      # Coverage was previously measured by hand per PR (74.79% -> 91.77%
      # region across three of them); this makes the number free and visible
      # on every push instead.
      - name: Coverage
        # bash for pipefail: with the default `bash -e` the step takes `tee`'s
        # exit status, so a test that fails only under `-C instrument-coverage`
        # leaves the job green off the partial profraw.
        shell: bash
        run: |
          # A ratchet, not a target: region coverage measured 94.90% at 0.1.0,
          # so 92 catches a PR that deletes real tests while leaving room for
          # the normal noise of a refactor. Raise it when the number rises for
          # good -- lowering it is the thing that needs an argument.
          cargo llvm-cov --locked --all-features --summary-only --fail-under-regions 92 | tee coverage.txt
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.txt
            lcov.info
