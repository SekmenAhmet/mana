name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Two pushes in quick succession: the older run is obsolete the moment the
# newer one starts — cancel it instead of burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows is in the matrix because v2 claims cross-platform support —
        # claimed-but-untested is how the v1 flow shipped broken.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose

  health:
    name: deps & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The dependency gate: RustSec advisories, license allowlist, duplicate
      # majors, source restrictions. Renovate proposes updates; this blocks
      # the bad ones. Config + accepted-debt list live in deny.toml.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # `.github/workflows/release.yml` is generated from dist-workspace.toml.
      # Editing one without regenerating the other is a release that builds the
      # wrong things, discovered at tag time; this catches it at PR time. The
      # version must match `cargo-dist-version` in dist-workspace.toml -- a
      # different dist generates a different workflow.
      - name: Check the release workflow matches dist-workspace.toml
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          "$HOME/.cargo/bin/dist" generate --check

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage was previously measured by hand per PR (74.79% -> 91.77%
      # region across three of them); this makes the number free and visible
      # on every push instead.
      - name: Coverage
        run: |
          cargo llvm-cov --all-features --summary-only | tee coverage.txt
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            lcov.info
