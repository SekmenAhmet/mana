# Filters for this project. Empty until a command earns one.
#
# Nothing below is active — it is the shape of an entry, not an example of a
# filter you have. The agent adds real ones when a command turns out to be
# worth shortening.
#
# [[filter]]
# id        = "<name>"              # the file under .hone/filters/
# signature = "<name>"              # what `hone sig -- <your command>` prints
# path      = "filters/<name>"
# shape     = []                    # argv tokens this filter needs, e.g. ["--json"]
# cases     = ["exit0"]             # what it already handles, for whoever extends it
