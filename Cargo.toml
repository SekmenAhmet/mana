[package]
name = "mana"
version = "0.1.0"
edition = "2024"
# Not on crates.io yet; releases ship as GitHub binaries. Flipping this
# requires choosing a license first (deny gates on it).
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
strip-ansi-escapes = "0.2"
anyhow = "1"
thiserror = "1"
dirs = "5"
which = "6"
dialoguer = "0.12"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
