[package]
name = "mana"
version = "0.1.0"
edition = "2024"
# Not on crates.io yet; releases ship as GitHub binaries. Flipping this
# requires choosing a license first (deny gates on it).
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
strip-ansi-escapes = "0.2"
anyhow = "1"
# The catalogue's failure signatures are regexes written by hand (in the
# shipped files and in the user's local override), and matching them against a
# sub-agent's output is what turns "the CLI exited 1" into "the quota pool is
# exhausted". Already in the tree transitively, so it adds nothing to audit.
regex = "1"
dirs = "6"
which = "6"
dialoguer = "0.11"

# Only for `killpg`: a sub-agent that times out must die together with anything
# it spawned, and std can only signal the direct child (`Child::kill`). No
# std API reaches a process group, so the spawner calls libc directly. Already
# in the tree transitively, so this adds no new dependency to audit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
