[package]
name = "mana"
version = "0.1.0"
edition = "2024"
# `edition = "2024"` alone needs 1.85, but the floor is set higher by the
# dependency tree: rmcp 3 (and darling/instability under it) declare
# `rust-version = "1.88"`, so cargo refuses the lock file below that. Verified
# empirically -- `cargo +1.85 check --locked` fails on those crates, 1.88
# passes. Stated here so an older stable gets cargo's "requires rustc 1.88"
# instead of a raw `feature 'edition2024' is required`.
rust-version = "1.88"
# Not on crates.io yet; releases ship as GitHub binaries. crates.io
# publication is a separate decision from the license (chosen 2026-08-16).
publish = false
# The Rust ecosystem's standard pair: MIT for frictionless use, Apache-2.0
# for its explicit patent grant — protecting users and contributors both.
license = "MIT OR Apache-2.0"
# Not decoration: cargo-dist refuses to generate GitHub CI without it (it needs
# the owner/repo to build release URLs), and `self_update`'s GitHub backend
# targets the same repo from the constants in src/cli/upgrade.rs.
repository = "https://github.com/SekmenAhmet/mana"

# `publish = false` above also hides this crate from cargo-dist's workspace
# scan ("no packages with distable binaries") -- dist reads it as "not meant to
# leave the machine". It is meant to leave the machine, just not via crates.io,
# so say so explicitly. Without this line `dist plan` finds nothing to build.
[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `[pm.events]` map is JSONPath, because that is the one query language a
# catalogue author can be expected to already know, and it is now RFC 9535 --
# so "what mana extracts from a CLI's stream" is a spec, not a homegrown
# selector dialect. This crate implements that RFC; the alternative was writing
# the matcher by hand, which is exactly the per-CLI parsing the design forbids.
# Default features bring the RFC's function extensions (`match`, `search`) via
# regex, already a direct dependency here, so they add no new audit surface.
serde_json_path = "0.7"
# The one serialization format mana reads and writes: config, catalogue, task
# frontmatter (`+++` fences). Its predecessor `serde_yaml` is archived
# upstream, which is half the reason; the other half is that one format means
# one set of surprises.
toml = "1.0"
# `mana upgrade` and the soft version check at launch. Every feature here is a
# decision, so each gets a line:
#
# `default-features = false` -- the defaults are `["reqwest", "default-tls"]`,
#   and native-tls means linking three different platform TLS stacks. rustls is
#   one implementation everywhere.
# `archive-tar` + `compression-flate2` -- must match what cargo-dist actually
#   uploads, which dist-workspace.toml pins to `.tar.gz` on every target. Note
#   that `self_update` silently treats an unknown extension as "not an archive"
#   and copies the raw bytes over the binary, so this pairing is load-bearing.
# `ureq` -- an HTTP client has to be named explicitly since 0.42, which made
#   the client pluggable: `rustls` expands to `reqwest?/rustls` +
#   `ureq?/rustls`, both gated on an optional dependency nothing else enables,
#   so `default-features = false` + `rustls` alone compiles *no* client at all
#   and every request becomes a compile error. That is the whole of the
#   0.41 -> 0.44 break.
#
#   ureq rather than the default reqwest: reqwest 0.13 pulls rustls with the
#   aws-lc-rs provider, i.e. `aws-lc-sys`, a C library needing cmake (and NASM
#   on windows-msvc) at build time -- a build-environment requirement on the
#   exact target cargo-dist has to cross-build. ureq's rustls uses `ring`, and
#   drops hyper/h2/tower/reqwest from the graph entirely. mana makes one
#   blocking GET a day and one download per `mana upgrade`; a blocking client
#   is the right size for that.
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "compression-flate2", "rustls", "ureq"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
# The catalogue's failure signatures are regexes written by hand (in the
# shipped files and in the user's local override), and matching them against a
# sub-agent's output is what turns "the CLI exited 1" into "the quota pool is
# exhausted". Already in the tree transitively, so it adds nothing to audit.
regex = "1"
dirs = "6"
which = "8"
dialoguer = "0.11"
# The MCP server the PM talks to (`mana mcp-server`, design §5). `rmcp` is the
# official SDK under the modelcontextprotocol org; the alternative
# (`rust-mcp-sdk`) is a third-party stack with ~1% of the downloads and a
# slower release cadence -- see the module comment in src/mcp.rs for the full
# comparison. Features cut to the bone: a server on stdio and the derive
# macros, no HTTP/SSE/OAuth/client transports.
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "macros"] }
# rmcp is async; mana is not. One current-thread runtime is built inside the
# `mcp-server` subcommand and nowhere else, so this stays a leaf dependency of
# that one command rather than a colour spreading through the codebase.
tokio = { version = "1", default-features = false, features = ["rt", "io-util"] }

# Only for `killpg`: a sub-agent that times out must die together with anything
# it spawned, and std can only signal the direct child (`Child::kill`). No
# std API reaches a process group, so the spawner calls libc directly. Already
# in the tree transitively, so this adds no new dependency to audit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
